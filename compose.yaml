services:
  postgres:
    image: postgres:16
    container_name: consent-core-postgres
    environment:
      POSTGRES_DB: consent_core
      POSTGRES_USER: consent_app
      POSTGRES_PASSWORD: consent_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consent_app -d consent_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - consent-core-postgres-data:/var/lib/postgresql/data

volumes:
  consent-core-postgres-data:
